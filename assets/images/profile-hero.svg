<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0d16" />
      <stop offset="50%" stop-color="#131424" />
      <stop offset="100%" stop-color="#07080d" />
    </linearGradient>
    <linearGradient id="neonCyanPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <radialGradient id="avatarGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#3b82f6" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="600" rx="36" fill="url(#heroBg)" />
  <circle cx="300" cy="260" r="220" fill="url(#avatarGlow)" />

  <!-- Tech Grid & Circuits -->
  <g stroke="#8b5cf6" stroke-opacity="0.15" stroke-width="1.5">
    <line x1="100" y1="120" x2="500" y2="120" />
    <line x1="100" y1="480" x2="500" y2="480" />
    <line x1="120" y1="100" x2="120" y2="500" />
    <line x1="480" y1="100" x2="480" y2="500" />
    <!-- Diagonal Corner Accents -->
    <path d="M 60 100 L 100 60" />
    <path d="M 500 60 L 540 100" />
    <path d="M 60 500 L 100 540" />
    <path d="M 500 540 L 540 500" />
  </g>

  <!-- Glowing Circular Orbital Rings -->
  <circle cx="300" cy="270" r="160" stroke="url(#neonCyanPurple)" stroke-width="2.5" fill="none" stroke-dasharray="14 8" opacity="0.8" />
  <circle cx="300" cy="270" r="185" stroke="#38bdf8" stroke-width="1.5" fill="none" stroke-dasharray="6 12" opacity="0.4" />

  <!-- Orbiting Tech Dots -->
  <circle cx="430" cy="180" r="6" fill="#38bdf8" filter="url(#glowEffect)" />
  <circle cx="170" cy="360" r="5" fill="#a855f7" filter="url(#glowEffect)" />
  <circle cx="300" cy="110" r="4" fill="#06b6d4" />

  <!-- Modern Developer Silhouette / Avatar Frame -->
  <g transform="translate(300, 260)">
    <!-- Head -->
    <circle cx="0" cy="-45" r="58" fill="#1e2038" stroke="url(#neonCyanPurple)" stroke-width="2.5" />
    <!-- Hair / Sleek Cut styling -->
    <path d="M -54 -40 C -52 -85, 52 -85, 54 -40 C 40 -65, -40 -65, -54 -40 Z" fill="#2d3056" />
    <!-- Torso -->
    <path d="M -90 95 C -90 10, -50 -5, 0 -5 C 50 -5, 90 10, 90 95 Z" fill="#1b1c31" stroke="url(#neonCyanPurple)" stroke-width="2" />
    <!-- Collar Detail -->
    <path d="M -30 25 L 0 50 L 30 25" stroke="#8b5cf6" stroke-width="2.5" fill="none" />
    <!-- Monogram Initials Badge on Chest -->
    <rect x="-32" y="70" width="64" height="24" rx="12" fill="#0c0d16" stroke="#38bdf8" stroke-width="1.5" />
    <text x="0" y="86" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="2">STS</text>
  </g>

  <!-- Interactive / Floating UI Chip -->
  <g transform="translate(60, 480)">
    <rect width="480" height="74" rx="18" fill="#0c0e1a" fill-opacity="0.85" stroke="url(#neonCyanPurple)" stroke-width="1.5" />
    <circle cx="45" cy="37" r="18" fill="#1a1c30" stroke="#8b5cf6" stroke-width="1.5" />
    <!-- Camera/Photo Icon -->
    <path d="M 37 42 L 37 34 C 37 33 38 32 39 32 L 41 32 L 43 30 L 47 30 L 49 32 L 51 32 C 52 32 53 33 53 34 L 53 42 C 53 43 52 44 51 44 L 39 44 C 38 44 37 43 37 42 Z" stroke="#38bdf8" stroke-width="1.5" fill="none" />
    <circle cx="45" cy="38" r="4" stroke="#a855f7" stroke-width="1.5" fill="none" />
    
    <text x="80" y="32" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="700" fill="#ffffff">SMERA T S</text>
    <text x="80" y="52" font-family="'JetBrains Mono', monospace" font-size="12" fill="#94a3b8">Ready for Photo • assets/images/profile-hero.jpg</text>
    
    <!-- Status indicator badge -->
    <rect x="390" y="26" width="70" height="22" rx="11" fill="#059669" fill-opacity="0.2" stroke="#10b981" stroke-width="1" />
    <circle cx="403" cy="37" r="3.5" fill="#10b981" />
    <text x="430" y="41" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="600" fill="#34d399">ACTIVE</text>
  </g>
</svg>

