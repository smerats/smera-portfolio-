<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="dfBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0b14" />
      <stop offset="50%" stop-color="#121324" />
      <stop offset="100%" stop-color="#07070d" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="35%" stop-color="#ec4899" />
      <stop offset="70%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="waveGlow">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" fill="url(#dfBg)" rx="24" />
  
  <!-- Subtle Grid Lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="80" x2="800" y2="80" />
    <line x1="0" y1="160" x2="800" y2="160" />
    <line x1="0" y1="240" x2="800" y2="240" />
    <line x1="0" y1="320" x2="800" y2="320" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="160" y1="0" x2="160" y2="480" />
    <line x1="320" y1="0" x2="320" y2="480" />
    <line x1="480" y1="0" x2="480" y2="480" />
    <line x1="640" y1="0" x2="640" y2="480" />
  </g>

  <!-- Header Badge -->
  <g transform="translate(40, 36)">
    <rect width="180" height="32" rx="16" fill="#1b1c31" stroke="#8b5cf6" stroke-width="1" />
    <circle cx="20" cy="16" r="4" fill="#a855f7" />
    <text x="36" y="21" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#c084fc">MFCC + CNN MODEL</text>
  </g>
  <g transform="translate(620, 36)">
    <rect width="140" height="32" rx="16" fill="#065f46" fill-opacity="0.3" stroke="#10b981" stroke-width="1" />
    <circle cx="20" cy="16" r="4" fill="#10b981" />
    <text x="36" y="21" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#34d399">ACCURACY 96.8%</text>
  </g>

  <!-- Audio Waveform Visualization -->
  <g transform="translate(40, 160)">
    <!-- Spectrogram Bars Background -->
    <g fill="#8b5cf6" fill-opacity="0.2">
      <rect x="0" y="30" width="8" height="60" rx="4" />
      <rect x="16" y="10" width="8" height="100" rx="4" />
      <rect x="32" y="45" width="8" height="30" rx="4" />
      <rect x="48" y="20" width="8" height="80" rx="4" />
      <rect x="64" y="0" width="8" height="120" rx="4" />
      <rect x="80" y="35" width="8" height="50" rx="4" />
      <rect x="96" y="15" width="8" height="90" rx="4" />
      <rect x="112" y="5" width="8" height="110" rx="4" />
      <rect x="128" y="40" width="8" height="40" rx="4" />
      <rect x="144" y="25" width="8" height="70" rx="4" />
      <rect x="160" y="0" width="8" height="120" rx="4" />
      <rect x="176" y="20" width="8" height="80" rx="4" />
      <rect x="192" y="35" width="8" height="50" rx="4" />
      <rect x="208" y="10" width="8" height="100" rx="4" />
      <rect x="224" y="30" width="8" height="60" rx="4" />
      <rect x="240" y="5" width="8" height="110" rx="4" />
      <rect x="256" y="25" width="8" height="70" rx="4" />
      <rect x="272" y="40" width="8" height="40" rx="4" />
      <rect x="288" y="15" width="8" height="90" rx="4" />
      <rect x="304" y="0" width="8" height="120" rx="4" />
      <rect x="320" y="30" width="8" height="60" rx="4" />
      <rect x="336" y="20" width="8" height="80" rx="4" />
    </g>

    <!-- Glowing Sine Wave -->
    <path d="M 0 60 Q 40 -20, 80 60 T 160 60 T 240 60 T 320 60 T 400 60 T 480 60 T 560 60 T 640 60 T 720 60" 
          stroke="url(#waveGrad)" stroke-width="4" fill="none" filter="url(#waveGlow)" />
  </g>

  <!-- CNN Feature Extraction Pipeline Diagram -->
  <g transform="translate(60, 310)">
    <!-- Step 1: Raw Audio -->
    <rect x="0" y="0" width="130" height="90" rx="14" fill="#131428" stroke="#8b5cf6" stroke-width="1.5" />
    <text x="65" y="38" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#e2e8f0">RAW AUDIO</text>
    <text x="65" y="60" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8">WAV / MP3 Input</text>

    <!-- Arrow 1 -->
    <path d="M 140 45 L 180 45 M 172 38 L 180 45 L 172 52" stroke="#8b5cf6" stroke-width="2" fill="none" />

    <!-- Step 2: MFCC Spectrogram -->
    <rect x="190" y="0" width="140" height="90" rx="14" fill="#131428" stroke="#3b82f6" stroke-width="1.5" />
    <text x="260" y="38" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#38bdf8">MFCC EXTRACTION</text>
    <text x="260" y="60" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8">Librosa Audio</text>

    <!-- Arrow 2 -->
    <path d="M 340 45 L 380 45 M 372 38 L 380 45 L 372 52" stroke="#3b82f6" stroke-width="2" fill="none" />

    <!-- Step 3: CNN Classifier -->
    <rect x="390" y="0" width="140" height="90" rx="14" fill="#131428" stroke="#a855f7" stroke-width="1.5" />
    <text x="460" y="38" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#c084fc">CNN MODEL</text>
    <text x="460" y="60" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8">PyTorch Classifier</text>

    <!-- Arrow 3 -->
    <path d="M 540 45 L 580 45 M 572 38 L 580 45 L 572 52" stroke="#a855f7" stroke-width="2" fill="none" />

    <!-- Step 4: Real vs Fake Verdict -->
    <rect x="590" y="0" width="150" height="90" rx="14" fill="#0f291e" stroke="#10b981" stroke-width="2" />
    <text x="665" y="34" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#34d399">REAL / FAKE</text>
    <text x="665" y="56" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#a7f3d0">Confidence Score</text>
    <circle cx="665" cy="74" r="5" fill="#10b981" filter="url(#waveGlow)" />
  </g>
</svg>

