<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="prBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090a14" />
      <stop offset="50%" stop-color="#141126" />
      <stop offset="100%" stop-color="#090912" />
    </linearGradient>
    <linearGradient id="violetPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="prGlow">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" fill="url(#prBg)" rx="24" />

  <!-- Camera Viewfinder Corners -->
  <g stroke="#ec4899" stroke-width="2.5" fill="none">
    <path d="M 40 70 L 40 40 L 70 40" />
    <path d="M 760 70 L 760 40 L 730 40" />
    <path d="M 40 410 L 40 440 L 70 440" />
    <path d="M 760 410 L 760 440 L 730 440" />
  </g>

  <!-- Header Badge -->
  <g transform="translate(90, 45)">
    <rect width="210" height="32" rx="16" fill="#201530" stroke="#ec4899" stroke-width="1" />
    <circle cx="20" cy="16" r="4" fill="#ec4899" filter="url(#prGlow)" />
    <text x="36" y="21" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#f472b6">FACE MATCHING ENGINE</text>
  </g>
  <g transform="translate(530, 45)">
    <rect width="180" height="32" rx="16" fill="#1b1c35" stroke="#8b5cf6" stroke-width="1" />
    <circle cx="20" cy="16" r="4" fill="#a855f7" />
    <text x="36" y="21" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#c084fc">EVENT PHOTO RADAR</text>
  </g>

  <!-- Central Face Detection & Mesh HUD -->
  <g transform="translate(140, 110)">
    <!-- Face Bounding Box with Scanning Glow -->
    <rect x="0" y="0" width="220" height="240" rx="18" fill="#131024" fill-opacity="0.8" stroke="url(#violetPink)" stroke-width="2" />
    
    <!-- Target Crosshairs -->
    <line x1="20" y1="120" x2="35" y2="120" stroke="#ec4899" stroke-width="2" />
    <line x1="185" y1="120" x2="200" y2="120" stroke="#ec4899" stroke-width="2" />
    <line x1="110" y1="20" x2="110" y2="35" stroke="#ec4899" stroke-width="2" />
    <line x1="110" y1="205" x2="110" y2="220" stroke="#ec4899" stroke-width="2" />

    <!-- Stylized Face Landmarks Wireframe -->
    <ellipse cx="110" cy="115" rx="55" ry="75" fill="none" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="4 4" />
    <!-- Eyes -->
    <ellipse cx="90" cy="100" rx="10" ry="6" fill="none" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="90" cy="100" r="2.5" fill="#38bdf8" />
    <ellipse cx="130" cy="100" rx="10" ry="6" fill="none" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="130" cy="100" r="2.5" fill="#38bdf8" />
    <!-- Nose line -->
    <line x1="110" y1="102" x2="110" y2="125" stroke="#a855f7" stroke-width="1.5" />
    <!-- Smile curve -->
    <path d="M 95 142 Q 110 155, 125 142" stroke="#ec4899" stroke-width="1.8" fill="none" />

    <!-- Feature Vector Nodes (Landmarks) -->
    <circle cx="90" cy="85" r="3" fill="#ec4899" />
    <circle cx="130" cy="85" r="3" fill="#ec4899" />
    <circle cx="70" cy="120" r="3" fill="#38bdf8" />
    <circle cx="150" cy="120" r="3" fill="#38bdf8" />
    <circle cx="110" cy="170" r="3" fill="#10b981" />

    <!-- Match ID Badge -->
    <rect x="25" y="195" width="170" height="26" rx="8" fill="#2a1236" stroke="#f43f5e" stroke-width="1" />
    <text x="110" y="212" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#fda4af">MATCH FOUND • 99.4%</text>
  </g>

  <!-- Connection Link Waves -->
  <g transform="translate(390, 210)">
    <path d="M 0 20 L 50 20" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="6 4" />
    <circle cx="25" cy="20" r="4" fill="#a855f7" filter="url(#prGlow)" />
  </g>

  <!-- Matched Event Photo Stream Results -->
  <g transform="translate(470, 110)">
    <rect width="250" height="240" rx="18" fill="#121122" stroke="#38bdf8" stroke-width="1.5" />
    <text x="25" y="32" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Identified Event Photos</text>
    <text x="25" y="48" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8">3 photos matched in 0.42s</text>

    <!-- Mini Thumbnail 1 -->
    <g transform="translate(20, 65)">
      <rect width="95" height="70" rx="8" fill="#1f1b38" stroke="#8b5cf6" stroke-width="1" />
      <circle cx="47" cy="30" r="14" fill="#312a57" />
      <rect x="15" y="50" width="65" height="10" rx="4" fill="#8b5cf6" fill-opacity="0.5" />
      <circle cx="82" cy="15" r="4" fill="#10b981" />
    </g>

    <!-- Mini Thumbnail 2 -->
    <g transform="translate(130, 65)">
      <rect width="95" height="70" rx="8" fill="#1f1b38" stroke="#ec4899" stroke-width="1" />
      <circle cx="47" cy="30" r="14" fill="#421d3f" />
      <rect x="15" y="50" width="65" height="10" rx="4" fill="#ec4899" fill-opacity="0.5" />
      <circle cx="82" cy="15" r="4" fill="#10b981" />
    </g>

    <!-- Mini Thumbnail 3 -->
    <g transform="translate(20, 150)">
      <rect width="205" height="65" rx="8" fill="#18172c" stroke="#38bdf8" stroke-width="1" />
      <circle cx="35" cy="32" r="16" fill="#1e324d" />
      <text x="65" y="28" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="600" fill="#e2e8f0">Event_Gala_042.jpg</text>
      <text x="65" y="46" font-family="'JetBrains Mono', monospace" font-size="10" fill="#38bdf8">Confidence: 99.4%</text>
    </g>
  </g>

  <!-- Technical Process Pill at bottom -->
  <g transform="translate(140, 380)">
    <rect width="520" height="50" rx="14" fill="#111020" stroke="#8b5cf6" stroke-width="1" />
    <text x="260" y="30" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#cbd5e1">
      <tspan fill="#ec4899">Face Embeddings</tspan> → <tspan fill="#8b5cf6">Cosine Similarity</tspan> → <tspan fill="#38bdf8">High-Speed Photo Retrieval</tspan>
    </text>
  </g>
</svg>

