<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="ktBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c14" />
      <stop offset="50%" stop-color="#0b1728" />
      <stop offset="100%" stop-color="#070d13" />
    </linearGradient>
    <linearGradient id="ktGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="ktGlow">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" fill="url(#ktBg)" rx="24" />

  <!-- Subtle Kerala Backwaters / Boat / Hill Silhouette Outline -->
  <path d="M 0 320 Q 200 280, 400 310 T 800 290 L 800 480 L 0 480 Z" fill="#0c1d2e" fill-opacity="0.5" />
  <path d="M 0 360 Q 250 330, 500 350 T 800 340 L 800 480 L 0 480 Z" fill="#081420" fill-opacity="0.8" />

  <!-- Palm Tree & Boat Minimalist Vector Accents -->
  <g stroke="#06b6d4" stroke-opacity="0.25" stroke-width="1.5" fill="none">
    <!-- Traditional Houseboat / Kettuvallam line art -->
    <path d="M 620 370 Q 690 355, 750 370 Q 720 385, 650 385 Z" fill="#13273e" stroke="#38bdf8" />
    <path d="M 650 370 L 650 355 L 720 355 L 720 370" stroke="#38bdf8" />
  </g>

  <!-- Header Badges -->
  <g transform="translate(40, 36)">
    <rect width="210" height="32" rx="16" fill="#112236" stroke="#06b6d4" stroke-width="1" />
    <circle cx="20" cy="16" r="4" fill="#06b6d4" />
    <text x="36" y="21" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#38bdf8">RAG &amp; VECTOR SEARCH</text>
  </g>
  <g transform="translate(590, 36)">
    <rect width="170" height="32" rx="16" fill="#1e1b4b" stroke="#8b5cf6" stroke-width="1" />
    <circle cx="20" cy="16" r="4" fill="#a855f7" />
    <text x="36" y="21" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#c084fc">MISTRAL 7B + FAISS</text>
  </g>

  <!-- Interactive Chat & Retrieval UI Mockup -->
  <g transform="translate(60, 95)">
    <!-- Chat Card -->
    <rect width="680" height="230" rx="20" fill="#0c1524" fill-opacity="0.9" stroke="url(#ktGrad)" stroke-width="1.5" />
    
    <!-- User Query Bubble -->
    <g transform="translate(30, 25)">
      <rect width="360" height="42" rx="14" fill="#1a2e4a" />
      <text x="18" y="26" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" fill="#e2e8f0">"Recommend a serene getaway in Munnar"</text>
    </g>

    <!-- FAISS Vector Similarity Nodes -->
    <g transform="translate(420, 28)">
      <rect width="230" height="36" rx="10" fill="#082f49" stroke="#0284c7" stroke-width="1" />
      <circle cx="20" cy="18" r="5" fill="#38bdf8" filter="url(#ktGlow)" />
      <text x="36" y="23" font-family="'JetBrains Mono', monospace" font-size="11" fill="#7dd3fc">FAISS Embedding Match: 98%</text>
    </g>

    <!-- Assistant Response Bubble -->
    <g transform="translate(30, 85)">
      <rect width="620" height="120" rx="16" fill="#13233a" stroke="#1e3a5f" stroke-width="1" />
      <circle cx="30" cy="30" r="14" fill="#0891b2" />
      <text x="30" y="34" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="bold" font-size="11" fill="#ffffff">AI</text>
      
      <text x="56" y="30" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="600" fill="#38bdf8">Kerala Tourism Assistant</text>
      <text x="56" y="55" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" fill="#cbd5e1">For a serene experience, explore Kolukkumalai tea estates at sunrise,</text>
      <text x="56" y="75" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" fill="#cbd5e1">followed by Mattupetty Lake boating and tranquil trails in Marayoor.</text>

      <!-- Recommendation Tags -->
      <g transform="translate(56, 92)">
        <rect width="90" height="20" rx="6" fill="#0f766e" fill-opacity="0.3" stroke="#14b8a6" stroke-width="0.8" />
        <text x="10" y="14" font-family="'JetBrains Mono', monospace" font-size="9" fill="#5eead4">Munnar Hills</text>
        
        <rect x="100" width="85" height="20" rx="6" fill="#0369a1" fill-opacity="0.3" stroke="#0ea5e9" stroke-width="0.8" />
        <text x="110" y="14" font-family="'JetBrains Mono', monospace" font-size="9" fill="#7dd3fc">Tea Gardens</text>

        <rect x="195" width="100" height="20" rx="6" fill="#6d28d9" fill-opacity="0.3" stroke="#a855f7" stroke-width="0.8" />
        <text x="205" y="14" font-family="'JetBrains Mono', monospace" font-size="9" fill="#d8b4fe">Streamlit App</text>
      </g>
    </g>
  </g>

  <!-- Technical Pipeline Footer -->
  <g transform="translate(60, 350)">
    <g transform="translate(0, 0)">
      <rect width="150" height="56" rx="12" fill="#0b1728" stroke="#3b82f6" stroke-width="1.2" />
      <text x="75" y="26" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#60a5fa">Sentence Xform</text>
      <text x="75" y="44" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8">all-MiniLM-L6-v2</text>
    </g>
    <g transform="translate(175, 0)">
      <rect width="150" height="56" rx="12" fill="#0b1728" stroke="#06b6d4" stroke-width="1.2" />
      <text x="75" y="26" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#22d3ee">FAISS Vector Index</text>
      <text x="75" y="44" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8">Semantic Retrieval</text>
    </g>
    <g transform="translate(350, 0)">
      <rect width="150" height="56" rx="12" fill="#0b1728" stroke="#8b5cf6" stroke-width="1.2" />
      <text x="75" y="26" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#a78bfa">Mistral LLM</text>
      <text x="75" y="44" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8">Generative Rationale</text>
    </g>
    <g transform="translate(525, 0)">
      <rect width="155" height="56" rx="12" fill="#0b1728" stroke="#10b981" stroke-width="1.2" />
      <text x="77" y="26" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#34d399">Streamlit UI</text>
      <text x="77" y="44" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8">Interactive Chatbot</text>
    </g>
  </g>
</svg>

